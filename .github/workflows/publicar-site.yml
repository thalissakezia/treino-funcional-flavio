name: Publicar Treino do Flávio
# Reexecutar após ativação do GitHub Pages em Settings > Pages.

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'imagens/**'
      - '.github/workflows/publicar-site.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Obter código
        uses: actions/checkout@v4
      - name: Preparar site
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site
          cp index.html _site/index.html
          cp -R imagens _site/imagens
          touch _site/.nojekyll
          test -f _site/index.html
          test -f _site/imagens/seg_1.webp
      - name: Configurar Pages
        uses: actions/configure-pages@v5
      - name: Enviar site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
