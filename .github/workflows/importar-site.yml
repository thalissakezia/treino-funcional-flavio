name: Importação antiga (desativada)

# A nova versão é mantida diretamente em index.html.
# A importação automática de ZIP antigo está desativada para não desfazer alterações.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  aviso:
    runs-on: ubuntu-latest
    steps:
      - name: Informação
        run: echo "Importação antiga desativada. O site é atualizado diretamente no index.html."
